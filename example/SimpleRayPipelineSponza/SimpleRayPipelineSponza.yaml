    object_rotation: [0,0,0]
    object_velocity: [0,0,0] #no use
    object_angular_velocity: [0,0,0] #no use
    object_material_id: 0
    resource_model_id: 0
    resource_texture_id_list: [1] #no use
    resource_default_graphics_pipeline_id: 2 #no use


