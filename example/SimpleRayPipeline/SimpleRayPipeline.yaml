CustomSpheres:
  - custom_sphere_name: Sphere0
    custom_sphere_id: 0
    custom_sphere_position: [0.0, -4.5, 0]
    custom_sphere_radius: 2.0
    custom_sphere_material_id: 0
    custom_sphere_visibility: true
  - custom_sphere_name: Sphere1
    custom_sphere_id: 1
    custom_sphere_position: [1.5, 0, 0]
    custom_sphere_radius: 0.5
    custom_sphere_material_id: 1
    custom_sphere_visibility: true
  - custom_sphere_name: Sphere2
    custom_sphere_id: 2
    custom_sphere_position: [-1.5, 0, -1.5]
    custom_sphere_radius: 0.75
    custom_sphere_material_id: 2
    custom_sphere_visibility: true
  - custom_sphere_name: Sphere3
    custom_sphere_id: 3
    custom_sphere_position: [0.0, 3, 0.0]
    custom_sphere_radius: 1
    custom_sphere_material_id: 3
    custom_sphere_visibility: true


Resources:
  - Models:
    - resource_model_name: cube.obj
    - resource_model_name: cube_10facet.obj
    - resource_model_name: low_poly_tree.obj
  - RayTracingShaders:
      resource_raytracing_pipeline_raygeneration_shader_name: simpleRayPipeline/raygen.rgen.spv
      resource_raytracing_pipeline_primary_miss_shader_name: simpleRayPipeline/primary.rmiss.spv
      resource_raytracing_pipeline_shadow_miss_shader_name: simpleRayPipeline/shadow.rmiss.spv
      resource_raytracing_pipeline_primary_closesthit_shader_name: simpleRayPipeline/primary.rchit.spv
      resource_raytracing_pipeline_shadow_closesthit_shader_name: simpleRayPipeline/shadow.rchit.spv
      resource_raytracing_pipeline_primary_anyhit_shader_name: simpleRayPipeline/primary.rahit.spv
      resource_raytracing_pipeline_shadow_anyhit_shader_name: simpleRayPipeline/shadow.rahit.spv
      resource_raytracing_pipeline_sphere_intersection_shader_name: simpleRayPipeline/sphere.rint.spv
      resource_raytracing_pipeline_sphere_primary_closesthit_shader_name: simpleRayPipeline/sphere_primary.rchit.spv
      resource_raytracing_pipeline_sphere_shadow_closesthit_shader_name: simpleRayPipeline/sphere_shadow.rchit.spv
      resource_raytracing_pipeline_callable_shader_name: none

Uniforms:
  RayTracing:
    uniform_raytracing_swapchain_storage: true
    storage_raytracing_material: true
  #Compute:
    #storage_custom_material: true #need enable this if want to use materials, otherwise it won't read material yaml
    #storage_custom_sphere: false this doesn't matter for rt pipeline. it is for compute pipeline. rt pipeline always enable spheres
  

Features:
  feature_rendermode: 5 #GRAPHICS=0, COMPUTE=1, COMPUTE_SWAPCHAIN=2, COMPUTE_GRAPHICS=3, GRAPHICS_SHADOWMAP=4， RAYTRACING_SWAPCHAIN=5
  feature_graphics_48pbt: false
  feature_graphics_push_constant: false
  feature_graphics_global_blend: false
  feature_graphics_rainbow_mipmap: false
  feature_graphics_observe_attachment_id: -1
  feature_graphics_show_performance_control: false
  feature_graphics_show_all_metric_controls: false

Attachments:
  ShadowmapRenderpass_attachment_depth_light: false
  mainsceneRenderpass_attachment_depth_light: false
  mainsceneRenderpass_attachment_depth_camera: false
  mainsceneRenderpass_attachment_color_resovle: false
  mainsceneRenderpass_attachment_color_present: false

MainCamera:
  camera_mode: 1
  camera_position: [0,0,-7]
  camera_rotation: [0,0,0]
  object_id_target: 0
  camera_z: [0.1, 256]
  camera_projection_enable_orthographic: false
  camera_projection_perspective_fov: 90
  camera_projection_orthographic_width: 8
  camera_projection_orthographic_height: 8
  camera_keyboard_sensitive: 3
  camera_mouse_sensitive: 60