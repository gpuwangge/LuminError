Resources:
  - ComputeShaders:
    - resource_computeshader_name: simpleRayCompute/shader.comp.spv

Uniforms:
  Compute:
    uniform_compute_name: Compute
    uniform_compute_global: true
    storage_compute_windowswap: true
    storage_compute_material: false
    storage_compute_triangle: false
    storage_compute_sphere: false
    uniform_compute_custom: true
    storage_compute_customswap: false
    uniform_compute_texture_storage: false
    uniform_compute_swapchain_storage: true
  
Features:
  feature_graphics_48pbt: false
  feature_graphics_push_constant: false
  feature_graphics_global_blend: false
  feature_graphics_rainbow_mipmap: false
  feature_graphics_observe_attachment_id: -1
  feature_graphics_show_performance_control: false
  feature_graphics_show_all_metric_controls: false

MainCamera:
  camera_mode: 0
  camera_position: [0,0,-3.0]
  camera_rotation: [0,0,0]
  object_id_target: 0
  camera_z: [0.1, 256]
  camera_projection_enable_orthographic: false
  camera_projection_perspective_fov: 90
  camera_projection_orthographic_width: 8
  camera_projection_orthographic_height: 8
  camera_keyboard_sensitive: 3
  camera_mouse_sensitive: 20
